name: Test Configuration Container

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build testing Docker container
        run: |
          docker build -t gk7205v300-test:latest .

      - name: Run test suite inside container
        run: |
          docker run --rm gk7205v300-test:latest
